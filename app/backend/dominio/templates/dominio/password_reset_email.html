<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperación de contraseña</title>
</head>
<body style="margin:0;padding:24px 12px;background-color:#f4f6f9;font-family:Arial,sans-serif;color:#243247;">
    <table role="presentation" style="width:100%;border-collapse:collapse;">
        <tr>
            <td align="center">
                <table role="presentation" style="width:100%;max-width:560px;border-collapse:collapse;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:12px;">
                    <tr>
                        <td style="padding:32px;">
                            <h1 style="margin:0 0 24px;font-size:24px;line-height:1.3;color:#0d6efd;">Recuperación de contraseña</h1>
                            <p style="margin:0 0 16px;font-size:16px;line-height:1.6;">Se solicitó restablecer la contraseña de su cuenta.</p>
                            <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">El enlace es válido durante una hora.</p>
                            <p style="margin:0 0 28px;">
                                <a href="{{ protocol }}://{{ domain }}{{ reset_page_path }}?uid={{ uid }}&amp;token={{ token }}" style="display:inline-block;padding:14px 24px;background-color:#0d6efd;border-radius:6px;color:#ffffff;font-size:16px;font-weight:bold;text-decoration:none;">Restablecer contraseña</a>
                            </p>
                            <p style="margin:0;font-size:14px;line-height:1.6;color:#526174;">Si no solicitó este correo, puede ignorarlo. Solicitar o dejar vencer un enlace no cambia la contraseña ni desbloquea la cuenta.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
